presubmits:
  kubernetes/test-infra:
  - name: pull-test-infra-node-e2e-containerd-resource-managers
    cluster: k8s-infra-prow-build
    labels:
      preset-service-account: 'true'
      preset-k8s-ssh: 'true'
    decorate: true
    decoration_config:
      timeout: 120m
    extra_refs:
    - org: kubernetes
      repo: kubernetes
      base_ref: master
      path_alias: k8s.io/kubernetes
      workdir: true
      base_sha: c4dd39a0e6aa7554624d1b407a375487b8a2242a
    spec:
      containers:
      - image: gcr.io/k8s-staging-test-infra/kubekins-e2e:v20261019-e80425793a-master
        command:
        - runner.sh
        - /workspace/scenarios/kubernetes_e2e.py
        args:
        - --deployment=node
        - --gcp-zone=us-east1-b
        - --node-args=--image-config-file=/home/prow/go/src/k8s.io/test-infra/jobs/e2e_node/containerd/image-config-serial-resource-managers.yaml
        - '--node-test-args=--container-runtime-endpoint=unix:///run/containerd/containerd.sock --container-runtime-process-name=/usr/bin/containerd --container-runtime-pid-file= --kubelet-flags="--cgroups-per-qos=true --cgroup-root=/ --runtime-cgroups=/system.slice/containerd.service" --extra-log="{\"name\": \"containerd.log\", \"journalctl\": [\"-u\", \"containerd*\"]}"'
        - --node-tests=true
        - --provider=gce
        - --test_args=--nodes=1 --focus="\[Feature:CPUManager\]|\[Feature:MemoryManager\]|\[Feature:TopologyManager\]"
        - --timeout=90m
        env:
        - name: GOPATH
          value: /go
        resources:
          limits:
            cpu: 4
            memory: 6Gi
          requests:
            cpu: 4
            memory: 6Gi
    annotations:
      testgrid-dashboards: sig-node-presubmits
      description: Runs resource-manager node tests with the proposed test-infra configuration
    always_run: false
    optional: true
    skip_report: false
    skip_branches:
    - release-\d+\.\d+
    path_alias: k8s.io/test-infra
